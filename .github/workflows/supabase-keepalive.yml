# Calls /api/health every 4 hours so the free Supabase project sees enough
# activity not to be paused (the daily Vercel Cron alone was not enough).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://example.com (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/health"
